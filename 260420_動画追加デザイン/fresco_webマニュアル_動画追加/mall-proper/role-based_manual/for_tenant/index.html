<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>fresco マニュアル</title>
    <link rel="stylesheet" href="../../../css/common.css" />
    <link rel="stylesheet" href="../../../css/role-based_manual/style.css">
    <link rel="stylesheet" href="../../../css/role-based_manual/for_tenant.css">
  </head>

  <body>
    <!-- header  -->
    <header class="header">
      <div class="header_inner">
        <div class="logo">
          <a href="../../index.html">
            <img src="../../../img/logo-white.svg" alt="fresco" />
            <h1 class="h1">マニュアル</h1>
          </a>
        </div>
      </div>
    </header>

    <!-- main  -->
    <main>
      <!-- パンくずリスト -->
      <nav class="breadcrumbs">
        <ol>
          <li>
            <a href="../../index.html">マニュアルトップ</a>
          </li>
          <li>
            <a href="index.html">テナント向け</a>
          </li>
        </ol>
      </nav>

      <!-- PDFマニュアル -->
      <section class="manual_pdf">
        <div class="container">
          <h2 class="title">fresco運用マニュアル</h2>
          <div class="manual_wrapper">
            <p>以下のボタンより、運用マニュアル（PDF）をご確認いただけます。</p>
            <div class="manual_btn"><a href="../../../pdf/tenant.pdf" target="_blank">テナント向け運用マニュアル</a></div>
          </div>
        </div>
      </section>

      <!-- 動画マニュアル -->
      <section class="manual_movies">
        <div class="container">
          <h2 class="title">動画マニュアルを見る</h2>
          <div class="manual_wrapper">
            <p>fresco をすぐにご利用いただけるよう、<br />frescoの基本的な操作方法や機能を動画で紹介しています。</p>
            <div class="movies_wrapper">
              <h3 class="h3">fresco 機能解説</h3>
              <video class="video" src="../../../movies/tenant/manual_tenant01.mp4" type="video/mp4" controls controlsList="nodownload" poster="../../../img/thumbnails/tenant/manual_tenant01.png"></video>
              <div class="about_movie">
                <h4 class="h4">この動画で解説すること</h4>
                <div class="note">
                  <ul class="note_list">
                    <li>テナント情報編集</li>
                    <li>セール・お得情報のテナント入稿</li>
                    <li>ショップニュース作成</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- footer  -->
    <footer class="footer">
      <div class="footer_inner">
        <!-- logo,copylight  -->
        <div class="copylight">
          <div class="logo footer-logo">
            <a href="../../index.html">
              <img src="../../../img/logo-white.svg" alt="fresco" />
              <h1 class="h1">マニュアル</h1>
            </a>
          </div>
          <span>&#64;2025 Atfive</span>
        </div>
      </div>
    </footer>
    <!-- button back to top -->
    <button class="back-to-top" id="back-to-top" style="opacity: 1">
      <div class="triangle"></div>
    </button>
    <script src="../../../js/backtoTop.js"></script>
  </body>
</html>
